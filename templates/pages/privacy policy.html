<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Privacy Policy</title>
		<script>
			(function () {
				try {
					const savedTheme = localStorage.getItem('coupon-calculator:theme');
					if (savedTheme === 'light' || savedTheme === 'dark') {
						document.documentElement.setAttribute('data-theme', savedTheme);
					}
				} catch (error) {
					// Ignore storage errors and use the default theme.
				}
			})();
		</script>
		<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
	</head>
	<body>
		<main class="page-shell">
			<section class="app-card" aria-label="Privacy policy page">
				<h1>Privacy Policy</h1>
				<p>In progress...</p>
				<button type="button" class="secondary-btn" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href='/'; }">Back</button>
			</section>
		</main>
	</body>
</html>
